[package]
name = "hxp-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "好想跑 native core: NetSecKit envelope, request signing"
publish = false

[lib]
name = "hxp_core"
path = "src/lib.rs"

[[bin]]
name = "hxp-core"
path = "src/main.rs"

[dependencies]
aes = "0.8"
cbc = "0.1"
rsa = { version = "0.9", features = ["pem"] }
md-5 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
num-bigint-dig = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
